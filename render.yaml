services:
  - type: web
    name: eren-creator-studio
    runtime: python
    plan: free
    buildCommand: python3 -m py_compile server.py youtube.py
    startCommand: python3 server.py
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
